name: Publish to MCP Registry

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # required for GitHub OIDC auth to the registry

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Authenticate (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish server.json
        run: |
          set +e
          OUT=$(mcp-publisher publish 2>&1); CODE=$?
          echo "$OUT"
          if [ $CODE -eq 0 ]; then exit 0; fi
          # A version already published manually (e.g. via the local publisher)
          # is not an error — the registry already has it. Only fail on anything else.
          if echo "$OUT" | grep -qi "duplicate version"; then
            echo "::notice::Version already live in the registry — nothing to publish."
            exit 0
          fi
          exit $CODE
